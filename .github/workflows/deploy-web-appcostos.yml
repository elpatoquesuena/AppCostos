name: Publicar auditoría web de AppCostos

on:
  push:
    branches:
      - main
    paths:
      - "web_app/**"
      - ".github/workflows/deploy-web-appcostos.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_app

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
